      function createWordSvgIllustration(word) {
        const cleanWord = (word || '').trim().toLowerCase();
        if (PROFESSIONAL_WORD_IMAGES[cleanWord]) {
          return PROFESSIONAL_WORD_IMAGES[cleanWord];
        }
        const emoji = WORD_EMOJIS[cleanWord] || '🦉';
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">

          <text x="50%" y="45%" dominant-baseline="central" text-anchor="middle" font-size="90">${emoji}</text>

        </svg>`;
        return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
      }

      const getPhonetic = async (wordText) => {
        const clean = (wordText || '').trim().toLowerCase();
        if (COMMON_IPA[clean]) return COMMON_IPA[clean];
        try {
          const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(clean)}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data[0]) {
              if (data[0].phonetic) return data[0].phonetic;
              if (data[0].phonetics && data[0].phonetics.length > 0) {
                const found = data[0].phonetics.find(p => p.text);
                if (found) return found.text;
              }
            }
          }
        } catch (e) {}
        return `/${clean}/`;
      };

      const getSentence = async (wordText) => {
        const clean = (wordText || '').trim().toLowerCase();
        if (COMMON_SENTENCES[clean]) return COMMON_SENTENCES[clean];
        return `The word "${wordText}" is fun to spell!`;
      };

      const getImage = async (wordText) => {
        const clean = (wordText || '').trim().toLowerCase();
        if (PROFESSIONAL_WORD_IMAGES[clean]) {
          return PROFESSIONAL_WORD_IMAGES[clean];
        }
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2000);
          const wikiUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(clean)}&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=600&format=json&origin=*`;
          const response = await fetch(wikiUrl, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (response.ok) {
            const data = await response.json();
            if (data && data.query && data.query.pages) {
              const pages = Object.values(data.query.pages);
              if (pages.length > 0 && pages[0].imageinfo && pages[0].imageinfo[0]) {
                const info = pages[0].imageinfo[0];
                const imgUrl = info.thumburl || info.url;
                if (imgUrl && !imgUrl.endsWith('.svg') && !imgUrl.endsWith('.pdf')) {
                  return imgUrl;
                }
              }
            }
          }
        } catch (e) {}

        return createWordSvgIllustration(wordText);

      const pcmToWav = (pcmData, sampleRate = 22050) => {
        const buffer = new ArrayBuffer(44 + pcmData.length);
        const view = new DataView(buffer);
        const writeString = (offset, str) => {
          for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + pcmData.length, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, pcmData.length, true);
        new Uint8Array(buffer, 44).set(pcmData);
        return new Blob([buffer], { type: 'audio/wav' });
      };

      const downloadZip = async (words, courseName) => {
        if (typeof JSZip === 'undefined') throw new Error('JSZip not loaded');
        const zip = new JSZip();
        let audioCount = 0;
        for (const word of words) {
          if (word.status === WordStatus.COMPLETED && word.audioData) {
            const fileName = `${word.text.toLowerCase().replace(/[^a-z0-9]/gi, '_')}.wav`;
            zip.file(fileName, word.audioData);
            audioCount++;
          }
        }
        if (audioCount === 0) throw new Error('No audio files to zip.');
        const content = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${courseName.toLowerCase().replace(/[^a-z0-9]/gi, '_')}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const parseDocx = async (file) => {
        if (typeof mammoth === 'undefined') throw new Error('Mammoth.js not found.');
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        return result.value
          .split(/\r?\n/)
          .map(w => w.trim())
          .filter(w => w && !/\d/.test(w));
      };

      const parseXlsx = async (file) => {
        if (typeof XLSX === 'undefined') throw new Error('XLSX.js not found.');
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data);
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        return json
          .flat()
          .map(cell => (cell ? String(cell).trim() : ''))
          .filter(cell => cell && !/\d/.test(cell));
      };

      const parsePdf = async (file) => {
        if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js not found.');
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const words = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageWords = textContent.items
            .map(item => ('str' in item ? item.str.trim() : ''))
            .filter(w => w && !/\d/.test(w));
          for (const wordText of pageWords) {
            words.push({
              id: generateUniqueId(wordText),
              text: wordText,
              status: WordStatus.PENDING,
              phonetic: null,
              sentence: null,
              imageUrl: null,
              audioUrl: null,
              audioData: null,
              error: null,
            });
          }
        }
        return words;

        const unmatched = [];

            const blob = await zipEntry.async('blob');
            const matchingWord = currentWords.find(w => w.toLowerCase() === wordName);
            if (matchingWord) {
              matched.push({ text: matchingWord, audioBlob: blob });
            } else {
              unmatched.push(wordName);
            }
          }
        }
        return { matched, unmatched };

        const canvasRef = useRef(null);

        const [isSpinning, setIsSpinning] = useState(false);
        const [showCard, setShowCard] = useState(false);

        // Voice Challenge State & Transcripts
        const [voiceMode, setVoiceMode] = useState('idle'); // 'idle' | 'initial_listen' | 'initial_correct' | 'spelling' | 'final_listen' | 'completed' | 'error'
        const [completedLetterIndices, setCompletedLetterIndices] = useState([]);

        const [isFinalWordCorrect, setIsFinalWordCorrect] = useState(false);
        const [showRedX, setShowRedX] = useState(false);
        const [voiceInstruction, setVoiceInstruction] = useState('');
        const recognitionRef = useRef(null);

        // Recording & Spoken Transcripts State
        const [recordedAudioUrl, setRecordedAudioUrl] = useState(null);
        const [isPlayingRecording, setIsPlayingRecording] = useState(false);
        const [initialWordTranscript, setInitialWordTranscript] = useState('');
        const [spellingLettersTranscript, setSpellingLettersTranscript] = useState([]);
        const [finalWordTranscript, setFinalWordTranscript] = useState('');
        
        const mediaRecorderRef = useRef(null);
        const audioChunksRef = useRef([]);

        const currentAngleRef = useRef(0);

        const audioCtxRef = useRef(null);
        const pointerDeflectionRef = useRef(0);

        const playErrorTone = useCallback(() => {
          if (isMuted) return;
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(70, ctx.currentTime + 0.45);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.45);
          } catch (e) {}
        }, [isMuted]);

        const playPositiveChime = useCallback(() => {
          if (isMuted) return;
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.35);
          } catch (e) {}
        }, [isMuted]);

        const stopAudioRecording = useCallback(() => {
          if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
            try {
              mediaRecorderRef.current.stop();
            } catch (e) {}
          }
        }, []);

        const triggerVoiceError = useCallback(() => {
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch (e) {}
          }
          stopAudioRecording();
          playErrorTone();
          setShowRedX(true);
          setVoiceMode('error');
          setVoiceInstruction('Incorrect!');
          setTimeout(() => {
            setShowRedX(false);
            setVoiceMode('idle');
            setVoiceInstruction('');
          }, 1800);
        }, [playErrorTone, stopAudioRecording]);

        const normalizeLetterToken = (token) => {
          if (!token) return '';
          const clean = token.toLowerCase().trim().replace(/[^a-z0-9]/gi, '');
          const letterMap = {
            'a': 'a', 'ay': 'a', 'ey': 'a', 'ah': 'a', 'ei': 'a', 'hay': 'a',
            'b': 'b', 'be': 'b', 'bee': 'b', 'bi': 'b',
            'c': 'c', 'see': 'c', 'sea': 'c', 'si': 'c',
            'd': 'd', 'dee': 'd', 'di': 'd',
            'e': 'e', 'ee': 'e', 'i': 'e',
            'f': 'f', 'ef': 'f', 'eff': 'f',
            'g': 'g', 'gee': 'g', 'ji': 'g', 'gi': 'g',
            'h': 'h', 'aitch': 'h', 'haitch': 'h', 'eitch': 'h',
            'i': 'i', 'eye': 'i', 'ai': 'i', 'ay': 'i',
            'j': 'j', 'jay': 'j', 'jei': 'j',
            'k': 'k', 'kay': 'k', 'kei': 'k',
            'l': 'l', 'el': 'l', 'ell': 'l',
            'm': 'm', 'em': 'm',
            'n': 'n', 'en': 'n',
            'o': 'o', 'oh': 'o', 'ou': 'o',
            'p': 'p', 'pee': 'p', 'pi': 'p',
            'q': 'q', 'cue': 'q', 'kew': 'q', 'cu': 'q',
            'r': 'r', 'ar': 'r', 'are': 'r', 'er': 'r',
            's': 's', 'es': 's', 'ess': 's',
            't': 't', 'tee': 't', 'tea': 't', 'ti': 't',
            'u': 'u', 'you': 'u', 'yu': 'u',
            'v': 'v', 'vee': 'v', 'vi': 'v',
            'w': 'w', 'doubleyou': 'w', 'double u': 'w',
            'x': 'x', 'ex': 'x',
            'y': 'y', 'why': 'y', 'wai': 'y',
            'z': 'z', 'zee': 'z', 'zed': 'z'
          };
          return letterMap[clean] || (clean.length === 1 ? clean : clean.charAt(0));
        };

        const handleVoiceChallenge = async () => {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) {
            return;
          }

          if (voiceMode !== 'idle') return;

          // Clean previous recordings & transcripts
          if (recordedAudioUrl) {
            URL.revokeObjectURL(recordedAudioUrl);
            setRecordedAudioUrl(null);
          }
          setInitialWordTranscript('');
          setSpellingLettersTranscript([]);
          setFinalWordTranscript('');
          setIsPlayingRecording(false);

          // Start MediaRecorder Audio Stream
          try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              audioChunksRef.current = [];
              const mediaRecorder = new MediaRecorder(stream);
              mediaRecorderRef.current = mediaRecorder;

              mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                  audioChunksRef.current.push(event.data);
                }
              };

              mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                const url = URL.createObjectURL(audioBlob);
                setRecordedAudioUrl(url);
                stream.getTracks().forEach(track => track.stop());
              };

              mediaRecorder.start();
            }
          } catch (err) {
            console.warn('Could not record voice audio:', err);
          }

          const targetWord = selectedWord.text.trim().toLowerCase();
          const wordLength = targetWord.length;
          setVoiceMode('initial_listen');
          setCompletedLetterIndices([]);
          setIsInitialWordCorrect(false);
          setIsFinalWordCorrect(false);
          setVoiceInstruction(`🎤 Step 1 of 3: Say the full word "${selectedWord.text.toUpperCase()}"`);

          const isWordMatch = (spoken, target) => {
            if (!spoken || !target) return false;
            const cleanSpoken = spoken.toLowerCase().trim().replace(/[^a-z0-9\s]/gi, '');
            const cleanTarget = target.toLowerCase().trim().replace(/[^a-z0-9]/gi, '');
            if (cleanSpoken === cleanTarget) return true;
            const words = cleanSpoken.split(/\s+/);
            return words.includes(cleanTarget) || cleanSpoken.endsWith(cleanTarget) || cleanSpoken.startsWith(cleanTarget);
          };

          let currentStage = 'initial_listen';
          let letterPointer = 0;

          // Function to restart a clean recognition session per stage
          const startRecognitionForStage = (stage) => {
            if (recognitionRef.current) {
              try { recognitionRef.current.stop(); } catch (e) {}
            }

            const rec = new SpeechRecognition();
            recognitionRef.current = rec;
            rec.continuous = true;
            rec.interimResults = false;
            rec.lang = 'en-US';

            rec.onresult = (event) => {
              for (let i = event.resultIndex; i < event.results.length; i++) {
                const res = event.results[i];
                const rawTranscript = res[0].transcript.trim();
                if (!rawTranscript) continue;

                const cleanTranscript = rawTranscript.toLowerCase().replace(/[^a-z0-9\s]/gi, '');

                if (currentStage === 'initial_listen') {
                  // Stage 1: Evaluate ONLY the initial complete word
                  setInitialWordTranscript(rawTranscript);
                  if (isWordMatch(cleanTranscript, targetWord)) {
                    playPositiveChime();
                    setIsInitialWordCorrect(true);
                    currentStage = 'spelling';
                    setVoiceMode('spelling');
                    setVoiceInstruction(`🔤 Step 2 of 3: Spell letter 1 of ${wordLength} (${targetWord[0].toUpperCase()})...`);
                    setTimeout(() => {
                      setIsInitialWordCorrect(false);
                      startRecognitionForStage('spelling');
                    }, 800);
                    return;
                  } else {
                    triggerVoiceError();
                    return;
                  }
                } else if (currentStage === 'spelling') {
                  // Stage 2: Process and validate individual letters
                  const tokens = rawTranscript.split(/\s+/).filter(Boolean);
                  for (const tok of tokens) {
                    if (letterPointer >= wordLength) break;
                    const expectedLetter = targetWord[letterPointer];
                    const normalized = normalizeLetterToken(tok);

                    setSpellingLettersTranscript(prev => [...prev, tok.toUpperCase()]);

                    if (normalized === expectedLetter) {
                      const newIndex = letterPointer;
                      setCompletedLetterIndices(prev => [...prev, newIndex]);
                      playPositiveChime();
                      letterPointer++;

                      if (letterPointer === wordLength) {
                        currentStage = 'final_listen';
                        setVoiceMode('final_listen');
                        setVoiceInstruction(`🎤 Step 3 of 3: Great job! Say the full word "${selectedWord.text.toUpperCase()}" again...`);
                        setTimeout(() => {
                          startRecognitionForStage('final_listen');
                        }, 800);
                        return;
                      } else {
                        const nextLetter = targetWord[letterPointer].toUpperCase();
                        setVoiceInstruction(`🔤 Step 2 of 3: Spell letter ${letterPointer + 1} of ${wordLength} (${nextLetter})...`);
                      }
                    } else {
                      triggerVoiceError();
                      return;
                    }
                  }
                } else if (currentStage === 'final_listen') {
                  // Stage 3: Evaluate ONLY the final complete word
                  setFinalWordTranscript(rawTranscript);
                  if (isWordMatch(cleanTranscript, targetWord)) {
                    playPositiveChime();
                    setIsFinalWordCorrect(true);
                    setVoiceMode('completed');
                    setVoiceInstruction('🎉 Great job! Verification completed.');
                    stopAudioRecording();
                    try { rec.stop(); } catch (e) {}
                    setTimeout(() => {
                      setVoiceMode('idle');
                      setIsFinalWordCorrect(false);
                      setVoiceInstruction('');
                    }, 2500);
                    return;
                  } else {
                    triggerVoiceError();
                    return;
                  }
                }
              }
            };

            rec.onerror = () => {
              if (currentStage !== 'completed') {
                triggerVoiceError();
              }
            };

            try {
              rec.start();
            } catch (e) {
              triggerVoiceError();
            }
          };

          startRecognitionForStage('initial_listen');
        };

        const playRecordedAudio = (e) => {
          if (e) e.stopPropagation();
          if (!recordedAudioUrl) return;

          if (recordedAudioRef.current) {
            recordedAudioRef.current.pause();
          }

          const audio = new Audio(recordedAudioUrl);
          recordedAudioRef.current = audio;
          setIsPlayingRecording(true);
          audio.onended = () => setIsPlayingRecording(false);
          audio.onerror = () => setIsPlayingRecording(false);
          audio.play().catch(() => setIsPlayingRecording(false));
        };

        const playTick = useCallback(() => {
          if (isMuted) return;
          try {
            if (!audioCtxRef.current) {
              audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
            }
            const ctx = audioCtxRef.current;
            if (ctx.state === 'suspended') {
              ctx.resume();
            }
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800 + Math.random() * 80, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.012);

            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.012);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.012);
          } catch (e) {}
        }, [isMuted]);

        const validWords = useMemo(() => words.filter(w => w.status !== WordStatus.FAILED && !removedWordIds.has(w.id)), [words, removedWordIds]);

        const validWordsRef = useRef(validWords);
        useEffect(() => {
          validWordsRef.current = validWords;
        }, [validWords]);

        const colors = useMemo(() => [
          '#F43F5E', '#8B5CF6', '#3B82F6', '#10B981', '#F59E0B', '#EC4899', '#06B6D4', '#6366F1'
        ], []);

        useEffect(() => {
          const updateSize = () => {
            const widthBound = window.innerWidth - 32;
            const heightBound = window.innerHeight - (window.innerWidth < 640 ? 160 : 130);
            const size = Math.min(widthBound * 0.58, heightBound, 750);
            setCanvasSize(Math.max(size, 240));
          };
          updateSize();
          window.addEventListener('resize', updateSize);
          return () => window.removeEventListener('resize', updateSize);
        }, []);

        const drawWheel = useCallback(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const numSegments = validWords.length;
          const segmentAngle = (2 * Math.PI) / (numSegments || 1);
          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;
          const radius = canvas.width / 2 - 25;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Draw segments
          validWords.forEach((word, index) => {
            const startAngle = currentAngleRef.current + index * segmentAngle;
            const endAngle = startAngle + segmentAngle;

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = colors[index % colors.length];
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Word text and image illustration inside slice
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + segmentAngle / 2);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 3;
            const fontSize = Math.max(12, Math.floor(canvas.width / 28));
            ctx.font = `bold ${fontSize}px sans-serif`;

            const loadedImg = loadedImagesRef.current[word.id];
            if (loadedImg) {
              const imgSize = Math.max(18, Math.floor(canvas.width / 16));
              ctx.drawImage(loadedImg, radius - 30 - imgSize, -imgSize / 2, imgSize, imgSize);
              ctx.fillText(word.text, radius - 38 - imgSize, fontSize / 3);
            } else {
              ctx.fillText(word.text, radius - 25, fontSize / 3);
            }
            ctx.shadowBlur = 0;

            ctx.restore();
          });

          // Draw Center Circle
          const centerRadius = Math.max(25, Math.floor(canvas.width * 0.08));
          ctx.beginPath();
          ctx.arc(centerX, centerY, centerRadius, 0, 2 * Math.PI);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#333333';
          ctx.stroke();

          // Pointer physics
          const pivotX = centerX + radius + 18;
          const pivotY = centerY;
          const deflection = pointerDeflectionRef.current || 0;

          ctx.save();
          ctx.translate(pivotX, pivotY);
          ctx.rotate(deflection);

          ctx.beginPath();
          ctx.moveTo(-33, 0);
          ctx.lineTo(0, -15);
          ctx.lineTo(0, 15);
          ctx.closePath();
          ctx.fillStyle = '#e11d48';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#333333';
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 0, 3.5, 0, 2 * Math.PI);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.stroke();

          ctx.restore();
        }, [validWords, colors, canvasSize]);

        useEffect(() => {
          let isMounted = true;
          validWords.forEach(word => {
            if (word.imageUrl && !loadedImagesRef.current[word.id]) {
              const img = new Image();
              img.crossOrigin = 'anonymous';
              img.src = word.imageUrl;
              img.onload = () => {
                if (isMounted) {
                  loadedImagesRef.current[word.id] = img;
                  drawWheel();
                }
              };
            }
          });
          return () => { isMounted = false; };
        }, [validWords, drawWheel]);

        useEffect(() => {
          drawWheel();
        }, [drawWheel]);

        const spin = () => {
          const activeList = validWordsRef.current;
          if (isSpinning || activeList.length === 0) return;
          setIsSpinning(true);
          setShowCard(false);

          const randomSpins = 5 + Math.random() * 5;
          const targetDuration = 4000;
          const startTime = performance.now();
          const initialVelocity = (randomSpins * 2 * Math.PI) / 200;
          angularVelocityRef.current = initialVelocity;

          const numSegments = activeList.length;
          const segmentAngle = (2 * Math.PI) / (numSegments || 1);

          const animate = (currentTime) => {
            const elapsed = currentTime - startTime;
            if (elapsed < targetDuration) {
              const progress = elapsed / targetDuration;
              const easeOut = 1 - Math.pow(1 - progress, 3);
              currentAngleRef.current += (1 - easeOut) * angularVelocityRef.current;
              
              const currentSegment = Math.floor(currentAngleRef.current / segmentAngle);
              if (currentSegment !== lastTickSegmentRef.current) {
                playTick();
                lastTickSegmentRef.current = currentSegment;
                pointerDeflectionRef.current = 0.28;
              }

              pointerDeflectionRef.current = -pointerDeflectionRef.current * 0.65;
              if (Math.abs(pointerDeflectionRef.current) < 0.005) {
                pointerDeflectionRef.current = 0;
              }

              drawWheel();
              animationFrameRef.current = requestAnimationFrame(animate);
            } else {
              pointerDeflectionRef.current = 0;
              setIsSpinning(false);
              const currentValid = validWordsRef.current;
              const numSegments = currentValid.length;
              if (numSegments > 0) {
                const segmentAngle = (2 * Math.PI) / numSegments;
                const normalizedAngle = (2 * Math.PI - (currentAngleRef.current % (2 * Math.PI))) % (2 * Math.PI);
                const winningIndex = Math.floor(normalizedAngle / segmentAngle) % numSegments;
                const chosen = currentValid[winningIndex];
                setSelectedWord(chosen);
                setShowCard(true);
                if (chosen) {
                  setRemovedWordIds(prev => new Set(prev).add(chosen.id));
                  // No decir la palabra automáticamente al mostrar la figura
                }
              }
            }
          };

          animationFrameRef.current = requestAnimationFrame(animate);
        };

        useEffect(() => {
          return () => cancelAnimationFrame(animationFrameRef.current);
        }, []);

        const handleContainerClick = () => {
          if (showCard) return;
          spin();
        };

        const playImageSound = () => {
          if (!selectedWord || isMuted) return;
          playWordAudio(selectedWord.text);
        };

        const playWordAudio = (wordText) => {
          setIsSpeakingWholeWord(true);
          return new Promise((resolve) => {
            let resolved = false;
            const done = () => {
              if (!resolved) {
                resolved = true;
                setIsSpeakingWholeWord(false);
                resolve();
              }
            };
            if (isMuted) {
              setTimeout(done, 600);
              return;
            }
            if (selectedWord && selectedWord.audioUrl) {
              const audio = new Audio(selectedWord.audioUrl);
              audio.onended = done;
              audio.onerror = done;
              audio.play().catch(done);
              setTimeout(done, 3000);
            } else if (window.speechSynthesis) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(wordText);
              utterance.lang = 'en-US';
              utterance.rate = 0.8;
              utterance.onend = done;
              utterance.onerror = done;
              window.speechSynthesis.speak(utterance);
              setTimeout(done, 3000);
            } else {
              done();
            }
          });
        };

        const playLetterAudio = (letter) => {
          if (isMuted) {
            return new Promise((resolve) => setTimeout(resolve, 300));
          }
          return new Promise((resolve) => {
            if (!window.speechSynthesis) return setTimeout(resolve, 600);
            window.speechSynthesis.cancel();
            let resolved = false;
            const done = () => {
              if (!resolved) {
                resolved = true;
                resolve();
              }
            };
            const utterance = new SpeechSynthesisUtterance(letter);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            utterance.onend = done;
            utterance.onerror = done;
            window.speechSynthesis.speak(utterance);
            setTimeout(done, 1200);
          });
        };

        const handleSpellWordSequence = async (e) => {
          if (e) e.stopPropagation();
          if (isSpellingSequence || !selectedWord) return;
          setIsSpellingSequence(true);
          setActiveLetterIndex(-1);

          try {
            await playWordAudio(selectedWord.text);
            await new Promise(res => setTimeout(res, 900));

            const letters = selectedWord.text.split('');
            for (let i = 0; i < letters.length; i++) {
              const char = letters[i];
              setActiveLetterIndex(i);
              if (/[a-zA-Z0-9]/i.test(char)) {
                await playLetterAudio(char);
              } else {
                await new Promise(res => setTimeout(res, 400));
              }
            }
            setActiveLetterIndex(-1);
            await new Promise(res => setTimeout(res, 900));
            await playWordAudio(selectedWord.text);
          } catch (err) {
            console.error('Spelling sequence error:', err);
          } finally {
            setActiveLetterIndex(-1);
            setIsSpellingSequence(false);
          }
        };

        return (
          <div 
            className="fixed inset-0 z-50 flex flex-col justify-between p-2 sm:p-4 select-none overflow-hidden transition-colors duration-300" 
            style={{ 
              backgroundColor: '#c026d3',
              backgroundImage: 'none'
            }}
          >
            {/* Header / Top Bar */}
            <div className="relative w-full flex justify-between items-center z-10 px-2 sm:px-4 pt-1">
              <div className="flex items-center z-10 flex-shrink-0">
                <img src={logo || APP_LOGO_URL} alt="Logo" className="h-16 sm:h-24 md:h-28 w-auto object-contain drop-shadow" />
              </div>

              <div className="flex items-center space-x-2 z-10 justify-end ml-auto flex-shrink-0">
                <button
                  onClick={onStartQuiz}
                  className="bg-gradient-to-r from-amber-400 to-yellow-300 hover:from-amber-500 hover:to-yellow-400 text-gray-950 text-[10px] sm:text-xs font-black px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-xl shadow-md transition flex items-center space-x-1 sm:space-x-1.5 border border-amber-200"
                  title="Go to Unit 2: Listening & Picture Quiz"
                >
                  <span>🎧</span>
                  <span className="hidden xs:inline">Unit 2: Quiz</span>
                  <span className="xs:hidden">U2</span>
                </button>
                {removedWordIds.size > 0 && (
                  <button
                    onClick={() => setRemovedWordIds(new Set())}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] sm:text-xs font-bold px-2 sm:px-3 py-1.5 sm:py-2 rounded-xl shadow transition"
                    title="Reset words on the wheel"
                  >
                    🔄 <span className="hidden xs:inline">Reset</span> ({removedWordIds.size})
                  </button>
                )}
                <button
                  onClick={() => setIsMuted(!isMuted)}
                  className={`px-2.5 sm:px-3.5 py-1.5 rounded-full text-[11px] sm:text-xs font-bold shadow-md transition flex items-center space-x-1.5 ${
                    isMuted
                      ? 'bg-rose-600 text-white hover:bg-rose-700'
                      : 'bg-emerald-100 text-emerald-900 border border-emerald-300 hover:bg-emerald-200'
                  }`}
                  title="Toggle sound"
                >
                  <span>{isMuted ? '🔇' : '🔊'}</span>
                  <span>{isMuted ? 'Sound OFF' : 'Sound ON'}</span>
                </button>
                <button
                  onClick={onClose}
                  className="bg-red-500 hover:bg-red-600 text-white p-1.5 sm:p-2 rounded-full font-bold shadow-lg transition"
                  title="Close Wheel"
                >
                  <XIcon className="h-4 w-4 sm:h-5 sm:w-5" />
                </button>
              </div>
            </div>

            {/* Wheel Container alineado hacia la izquierda como en la imagen */}
            <div className="relative flex-1 flex items-center justify-start w-full px-4 sm:px-12 md:px-20 my-auto cursor-pointer" onClick={handleContainerClick}>
              <div className="relative flex items-center justify-center">
                <canvas
                  ref={canvasRef}
                  width={canvasSize}
                  height={canvasSize}
                  className="max-w-full max-h-[70vh] rounded-full shadow-2xl object-contain"
                />
                
                {!isSpinning && !showCard && validWords.length > 0 && (
                  <button
                    onClick={(e) => { e.stopPropagation(); spin(); }}
                    className="absolute inset-0 m-auto w-16 h-16 sm:w-24 sm:h-24 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm sm:text-xl rounded-full shadow-2xl flex items-center justify-center border-2 sm:border-4 border-white transition transform hover:scale-105"
                  >
                    SPIN
                  </button>
                )}
              </div>

              {!isSpinning && !showCard && validWords.length === 0 && (
                <div className="absolute left-6 sm:left-24 top-1/2 -translate-y-1/2 flex flex-col items-center justify-center p-4 sm:p-6 bg-white/95 text-gray-900 backdrop-blur-md rounded-3xl shadow-2xl border-4 border-amber-400 max-w-sm sm:max-w-md mx-auto text-center space-y-3 z-30 pointer-events-auto">
                  <div className="flex items-center justify-center space-x-2">
                    <span className="text-3xl sm:text-4xl">🎉</span>
                    <img src={APP_LOGO_URL} alt="Logo" className="h-20 sm:h-28 w-auto object-contain inline-block" />
                    <span className="text-3xl sm:text-4xl">🏆</span>
                  </div>
                  <h3 className="text-lg sm:text-xl font-black">
                    All words completed!
                  </h3>
                  <p className="text-xs sm:text-sm text-gray-700 font-medium px-2">
                    You have completed all spelling words! Advance to the next unit or reset the wheel.
                  </p>
                  <button
                    onClick={(e) => { e.stopPropagation(); onStartQuiz(); }}
                    className="w-full py-3 px-4 sm:px-6 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 hover:from-amber-600 hover:to-yellow-500 text-gray-950 font-black text-sm sm:text-base rounded-xl sm:rounded-2xl shadow-xl transition transform hover:scale-105 border-2 border-white flex items-center justify-center space-x-2 animate-bounce"
                  >
                    <span>🎧 Advance to Unit 2: Listen & Choose</span>
                    <span>➔</span>
                  </button>
                  <button
                    onClick={(e) => { e.stopPropagation(); setRemovedWordIds(new Set()); }}
                    className="text-xs text-gray-600 hover:text-gray-900 underline font-semibold"
                  >
                    🔄 Reset Wheel
                  </button>
                </div>
              )}
            </div>

            {/* Footer credit centrado */}
            <footer className="w-full text-center text-[11px] sm:text-xs py-1.5 font-medium text-white/80">
              By: Ing. Milko Gonzales C.
            </footer>

            {/* Card Overlay con fondo fucsia y posición hacia la izquierda */}
            {showCard && selectedWord && (
              <div 
                className="fixed inset-0 z-50 flex flex-col justify-between p-3 sm:p-6 select-none overflow-y-auto"
                style={{ backgroundColor: '#c026d3' }}
                onClick={() => !isSpellingSequence && voiceMode === 'idle' && setShowCard(false)}
              >
                {/* Full Screen Error Red X Overlay */}
                {showRedX && (
                  <div className="fixed inset-0 z-50 bg-red-950/90 flex flex-col items-center justify-center animate-shake pointer-events-none">
                    <div className="text-red-500 text-7xl sm:text-9xl font-black drop-shadow-[0_0_60px_rgba(239,68,68,0.9)]">
                      ✕
                    </div>
                    <p className="text-white text-2xl sm:text-3xl font-extrabold mt-4 sm:mt-6 uppercase tracking-widest drop-shadow">
                      Incorrect!
                    </p>
                  </div>
                )}

                {/* Top Bar con logo a la izquierda y botones a la derecha */}
                <div className="relative w-full flex justify-between items-center flex-shrink-0 px-2 sm:px-4">
                  <div className="flex items-center">
                    <img src={logo || APP_LOGO_URL} alt="Logo" className="h-16 sm:h-24 md:h-28 w-auto object-contain drop-shadow" />
                  </div>

                  <div className="flex items-center space-x-2 justify-end ml-auto">
                    {voiceInstruction && (
                      <span className="bg-black/40 px-3 py-1.5 rounded-full border border-white/30 text-white text-xs sm:text-sm font-semibold truncate mr-2">
                        {voiceInstruction}
                      </span>
                    )}
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        setIsMuted(!isMuted);
                      }}
                      className={`px-3 py-1.5 rounded-full text-xs font-bold shadow-md transition flex items-center space-x-1.5 ${
                        isMuted
                          ? 'bg-rose-600 text-white hover:bg-rose-700'
                          : 'bg-emerald-100 text-emerald-900 border border-emerald-300 hover:bg-emerald-200'
                      }`}
                      title="Toggle sound"
                    >
                      <span>{isMuted ? '🔇' : '🔊'}</span>
                      <span>{isMuted ? 'Sound OFF' : 'Sound ON'}</span>
                    </button>
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        setShowCard(false);
                      }}
                      className="bg-transparent hover:bg-white/20 text-white p-1.5 rounded-full transition text-2xl font-black leading-none"
                      title="Close Card"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* Card alineada a la izquierda (como en la captura posicion imagen.jpg) */}
                <div className="flex-1 flex flex-col justify-center items-start w-full px-4 sm:px-16 md:px-24 my-auto">
                  <div 
                    onClick={(e) => { e.stopPropagation(); playImageSound(); }} 
                    className="cursor-pointer group relative bg-white rounded-3xl p-4 sm:p-6 shadow-2xl border-4 sm:border-8 border-white flex flex-col items-center justify-between w-64 sm:w-80 md:w-96 transition transform hover:scale-[1.02]"
                    title="Click to listen"
                  >
                    <div className="w-full h-56 sm:h-72 md:h-80 flex items-center justify-center overflow-hidden rounded-2xl bg-white">
                      {selectedWord.imageUrl ? (
                        <img 
                          src={selectedWord.imageUrl} 
                          alt="" 
                          className="w-full h-full object-contain filter drop-shadow-md"
                        />
                      ) : (
                        <img 
                          src={createWordSvgIllustration(selectedWord.text)} 
                          alt="" 
                          className="w-full h-full object-contain" 
                        />
                      )}
                    </div>
                    <div className="w-full text-center mt-3 pt-2 border-t-2 border-gray-100">
                      <h2 className="text-3xl sm:text-4xl md:text-5xl font-black text-gray-950 uppercase tracking-wider font-bubble">
                        {selectedWord.text}
                      </h2>
                    </div>
                  </div>

      const Unit2Quiz = ({ words, onClose, onComplete }) => {
        const [currentIndex, setCurrentIndex] = useState(0);
        const [score, setScore] = useState(0);
        const [selectedOption, setSelectedOption] = useState(null);
        const [isAnswered, setIsAnswered] = useState(false);
        const [quizFinished, setQuizFinished] = useState(false);
        const [isShaking, setIsShaking] = useState(false);
        const [isRedAlert, setIsRedAlert] = useState(false);

        const currentWord = words[currentIndex];

        const playSuccessSound = useCallback(() => {
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            const freqs = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6 arpeggio
            freqs.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + idx * 0.08);
              gain.gain.setValueAtTime(0.22, now + idx * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.28);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.08);
              osc.stop(now + idx * 0.08 + 0.28);
            });
          } catch (e) {}
        }, []);

        const playErrorSound = useCallback(() => {
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(75, now + 0.38);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.38);
          } catch (e) {}
        }, []);

        // Prepare 3 picture options for current question
        const currentOptions = useMemo(() => {
          if (!currentWord || words.length === 0) return [];
          const otherWords = words.filter(w => w.id !== currentWord.id);
          const shuffledOthers = [...otherWords].sort(() => 0.5 - Math.random());
          const distractors = shuffledOthers.slice(0, 2);
          const options = [currentWord, ...distractors].sort(() => 0.5 - Math.random());
          return options;
        }, [currentWord, words]);

        const speakWordWithCallback = useCallback((wordText, audioUrl, onEndCallback) => {
          let hasFinished = false;
          const finish = () => {
            if (!hasFinished) {
              hasFinished = true;
              if (onEndCallback) onEndCallback();
            }
          };

          if (audioUrl) {
            const audio = new Audio(audioUrl);
            audio.onended = finish;
            audio.onerror = finish;
            audio.play().catch(finish);
            setTimeout(finish, 2600);
          } else if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(wordText);
            utterance.lang = 'en-US';
            utterance.rate = 0.82;
            utterance.onend = finish;
            utterance.onerror = finish;
            window.speechSynthesis.speak(utterance);
            setTimeout(finish, 2600);
          } else {
            setTimeout(finish, 800);
          }
        }, []);

        const playQuestionAudio = useCallback(() => {
          if (!currentWord) return;
          speakWordWithCallback(currentWord.text, currentWord.audioUrl);
        }, [currentWord, speakWordWithCallback]);

        useEffect(() => {
          if (currentWord) {
            playQuestionAudio();
          }
        }, [currentIndex]);

        const handleOptionClick = (option) => {
          if (isAnswered || !currentWord) return;
          setIsAnswered(true);
          setSelectedOption(option.id);

          const isCorrect = option.id === currentWord.id;

          if (isCorrect) {
            setScore(prev => prev + 1);
            playSuccessSound();
            if (typeof confetti === 'function') {
              confetti({
                particleCount: 85,
                spread: 75,
                origin: { y: 0.6 }
              });
            }
          } else {
            setIsShaking(true);
            setIsRedAlert(true);
            playErrorSound();
            setTimeout(() => {
              setIsShaking(false);
            }, 600);
            setTimeout(() => {
              setIsRedAlert(false);
            }, 1200);
          }

          // Advance to the next question automatically after finished speaking
          speakWordWithCallback(currentWord.text, currentWord.audioUrl, () => {
            setTimeout(() => {
              if (currentIndex + 1 < words.length) {
                setCurrentIndex(prev => prev + 1);
                setSelectedOption(null);
                setIsAnswered(false);
                setIsShaking(false);
                setIsRedAlert(false);
              } else {
                setQuizFinished(true);
              }
            }, 500);
          });
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-2 xs:p-3 sm:p-4 bg-gray-950/85 backdrop-blur-md overflow-y-auto">

              className={`bg-white dark:bg-gray-800 p-3 sm:p-6 md:p-8 rounded-2xl sm:rounded-3xl max-w-2xl w-full text-center relative shadow-2xl border transition-all duration-300 my-auto ${
                isShaking 
                  ? 'animate-shake border-red-500 ring-4 ring-red-500/50' 
                  : isRedAlert 
                  ? 'border-red-400 bg-red-50/20 dark:bg-red-950/30' 
                  : 'border-gray-200 dark:border-gray-700'
              }`}
            >
              <button 
                onClick={onClose} 
                className="absolute top-3 right-3 sm:top-5 sm:right-5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl sm:text-2xl font-bold p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition"
              >
                ✕
              </button>

              {!quizFinished ? (
                <div>
                  <h1 className="font-bubble text-xl xs:text-2xl sm:text-4xl font-extrabold tracking-wide text-gray-900 dark:text-white mb-1">
                    Unit 2: Listen & Choose
                  </h1>
                  <p className="text-xs sm:text-sm text-indigo-600 dark:text-indigo-400 font-bold mb-3 sm:mb-4">
                    Question {currentIndex + 1} of {words.length} — Score: <span className="text-emerald-600 dark:text-emerald-400 font-extrabold">{score}</span>
                  </p>

                  <div className="mb-3 sm:mb-5">
                    <button
                      onClick={playQuestionAudio}
                      className="px-4 py-2.5 sm:px-6 sm:py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold rounded-xl sm:rounded-2xl shadow-lg transition flex items-center justify-center space-x-2 mx-auto text-xs sm:text-base border border-indigo-400"
                    >
                      <SpeakerWaveIcon className="w-5 h-5 sm:w-6 sm:h-6 animate-bounce" />
                      <span>🔊 Tap to Listen to the Word</span>
                    </button>
                  </div>

                  <p className="text-xs sm:text-sm text-gray-500 dark:text-gray-400 font-medium mb-3 sm:mb-5">
                    Choose the picture that matches the word:
                  </p>

                  {/* Responsive 3-card grid fitted for mobile phones */}
                  <div className="grid grid-cols-3 gap-2 sm:gap-4 mb-3 sm:mb-4">
                    {currentOptions.map((opt) => {
                      const isCorrect = opt.id === currentWord.id;
                      const isSelected = selectedOption === opt.id;
                      let borderStyle = 'border-2 border-gray-200 dark:border-gray-700 hover:border-indigo-400';

                      if (isAnswered) {
                        if (isCorrect) {
                          borderStyle = 'border-2 sm:border-4 border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 ring-2 sm:ring-4 ring-emerald-400/60 scale-105 shadow-xl';
                        } else if (isSelected) {
                          borderStyle = 'border-2 sm:border-4 border-rose-500 bg-rose-100 dark:bg-rose-950/60 ring-2 sm:ring-4 ring-rose-500/60 scale-95';
                        } else {
                          borderStyle = 'border border-gray-200 dark:border-gray-700 opacity-40';
                        }
                      }

                      return (
                        <div
                          key={opt.id}
                          onClick={() => handleOptionClick(opt)}
                          className={`p-1.5 sm:p-3 rounded-xl sm:rounded-2xl cursor-pointer transition-all transform duration-200 bg-white dark:bg-gray-800 shadow-sm sm:shadow-md flex flex-col items-center justify-center relative overflow-hidden select-none active:scale-95 min-h-[110px] xs:min-h-[130px] sm:min-h-[190px] ${borderStyle}`}
                        >
                          <img
                            src={opt.imageUrl || createWordSvgIllustration(opt.text)}
                            alt={opt.text}
                            className="w-16 h-16 xs:w-20 xs:h-20 sm:w-32 sm:h-32 md:w-36 md:h-36 object-contain mb-1"
                          />
                          {isAnswered && (
                            <span className={`text-[10px] sm:text-xs font-bold px-1.5 sm:px-2 py-0.5 rounded-md max-w-full truncate ${isCorrect ? 'bg-emerald-600 text-white' : 'bg-gray-400 text-white'}`}>
                              {opt.text.toUpperCase()}
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {isAnswered && (
                    <p className="text-xs sm:text-sm font-semibold text-gray-500 dark:text-gray-400 animate-pulse">
                      Advancing to next question...
                    </p>
                  )}
                </div>
              ) : (
                <div className="py-4 sm:py-6 space-y-3 sm:space-y-4">
                  <div className="flex items-center justify-center space-x-2 text-4xl sm:text-5xl">
                    <span>🏆</span>
                    <img src={APP_LOGO_URL} alt="Logo" className="h-20 sm:h-32 w-auto object-contain inline-block" />
                    <span>⭐</span>
                  </div>
                  <h2 className="text-xl sm:text-3xl font-black text-gray-900 dark:text-white">
                    Congratulations!
                  </h2>
                  <p className="text-sm sm:text-lg text-gray-700 dark:text-gray-300 font-medium">
                    You completed the Unit 2 Quiz with a score of <span className="font-extrabold text-indigo-600 dark:text-indigo-400">{score} / {words.length}</span>!
                  </p>
                  <div className="flex flex-wrap justify-center gap-2 sm:gap-3 pt-2">
                    <button
                      onClick={onComplete}
                      className="px-5 sm:px-6 py-2.5 sm:py-3 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 hover:from-amber-600 hover:to-yellow-500 text-gray-950 font-black text-xs sm:text-base rounded-xl sm:rounded-2xl shadow-xl transition transform active:scale-95 flex items-center space-x-2 border-2 border-white"

                    >

              <div id="diploma-card" className="border-4 border-amber-600 p-6 sm:p-10 text-center relative bg-amber-50/30 rounded-2xl">
                <div className="flex items-center justify-center space-x-3 mb-2">
                  <img src={APP_LOGO_URL} alt="Logo" className="h-24 sm:h-36 w-auto object-contain" />

      const App = () => {
        const [words, setWords] = useState(() => {
          return DEFAULT_WORDS_DATA.map((item, idx) => ({
            id: generateUniqueId(`${item.text}-${idx}`),
            text: item.text,
            status: WordStatus.COMPLETED,
            phonetic: COMMON_IPA[item.text] || `/${item.text}/`,
            sentence: COMMON_SENTENCES[item.text] || `The word "${item.text}" is fun to spell!`,
            imageUrl: item.imageUrl,
            audioUrl: null,
            audioData: null,
            error: null,
          }));
        });

        const [toasts, setToasts] = useState([]);
        const [newWordsInput, setNewWordsInput] = useState('');
        const [courseName, setCourseName] = useState('Spelling Bee Helpers');
        const [viewMode, setViewMode] = useState('wheel'); // 'main' | 'wheel'
        const [spellingBeeWord, setSpellingBeeWord] = useState(null);
        const [background, setBackground] = useState('#ffffff');
        const [logo, setLogo] = useState(APP_LOGO_URL);
        const [isGenerating, setIsGenerating] = useState(false);
        const [showIntroVideo, setShowIntroVideo] = useState(true);
        const [videoMuted, setVideoMuted] = useState(false);
        const [showUnmutePrompt, setShowUnmutePrompt] = useState(false);

        // Global wheel state sync
        const [isWhiteBg, setIsWhiteBg] = useState(true);
        const [isMuted, setIsMuted] = useState(false);
        const [hideLetters, setHideLetters] = useState(false);
        const [showQuiz, setShowQuiz] = useState(false);
        const [showDiploma, setShowDiploma] = useState(false);

        const videoRef = useRef(null);

        const addToast = (message, type = 'info') => {
          setToasts(prev => [...prev, { id: generateUniqueId('toast'), message, type }]);
        };

        const handleAddWords = (e) => {
          if (e) e.preventDefault();
          if (!newWordsInput.trim()) return;
          const list = newWordsInput.split(/[\n,]+/).map(w => w.trim().toLowerCase()).filter(Boolean);
          const newItems = list.map(wordText => ({
            id: generateUniqueId(wordText),
            text: wordText,
            status: WordStatus.COMPLETED,
            phonetic: COMMON_IPA[wordText] || `/${wordText}/`,
            sentence: COMMON_SENTENCES[wordText] || `The word "${wordText}" is fun to spell!`,
            imageUrl: PROFESSIONAL_WORD_IMAGES[wordText] || createWordSvgIllustration(wordText),
            audioUrl: null,
            audioData: null,
            error: null,
          }));
          setWords(prev => [...prev, ...newItems]);
          setNewWordsInput('');
          addToast(`Added ${newItems.length} word(s)`, 'success');
        };

        useEffect(() => {
          if (showIntroVideo && videoRef.current) {
            const vid = videoRef.current;
            vid.currentTime = 0;
            const playPromise = vid.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {
                vid.muted = true;
                setVideoMuted(true);
                setShowUnmutePrompt(true);
                vid.play().catch(() => {
                  setShowIntroVideo(false);
                });
              });
            }
          }
        }, [showIntroVideo]);

        const handleUnmuteVideo = (e) => {
          if (e) e.stopPropagation();
          if (videoRef.current) {
            videoRef.current.muted = false;
            setVideoMuted(false);
            setShowUnmutePrompt(false);
          }
        };

        const handleSkipVideo = () => {
          if (videoRef.current) {
            videoRef.current.pause();
          }
          setShowIntroVideo(false);
        };

        const handleFileLoad = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;

          try {
            let extractedWords = [];
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.docx')) {
              extractedWords = await parseDocx(file);
            } else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
              extractedWords = await parseXlsx(file);
            } else if (fileName.endsWith('.pdf')) {
              const pdfWords = await parsePdf(file);
              extractedWords = pdfWords.map(w => w.text);
            } else if (fileName.endsWith('.zip')) {
              const currentWordTexts = words.map(w => w.text);
              const { matched, unmatched } = await parseZip(file, currentWordTexts);
              
              setWords(prev => prev.map(w => {
                const match = matched.find(m => m.text.toLowerCase() === w.text.toLowerCase());
                if (match) {
                  return {
                    ...w,
                    audioUrl: URL.createObjectURL(match.audioBlob),
                  };
                }
                return w;
              }));

              addToast(`Updated ${matched.length} word audio(s) from ZIP file.`, 'success');
              return;
            }

            if (extractedWords.length > 0) {
              const newItems = extractedWords.map(wordText => ({
                id: generateUniqueId(wordText),
                text: wordText.toLowerCase(),
                status: WordStatus.COMPLETED,
                phonetic: COMMON_IPA[wordText.toLowerCase()] || `/${wordText.toLowerCase()}/`,
                sentence: COMMON_SENTENCES[wordText.toLowerCase()] || `The word "${wordText}" is fun to spell!`,
                imageUrl: PROFESSIONAL_WORD_IMAGES[wordText.toLowerCase()] || createWordSvgIllustration(wordText.toLowerCase()),
                audioUrl: null,
                audioData: null,
                error: null,
              }));

              setWords(prev => [...prev, ...newItems]);
              addToast(`Imported ${newItems.length} word(s) from document`, 'success');
            }
          } catch (err) {
            addToast(`Error importing file: ${err.message}`, 'error');
          }
          e.target.value = '';
        };

        const handleDeleteWord = (id) => {
          setWords(prev => prev.filter(w => w.id !== id));
        };

        const handleRegenerateWord = async (id) => {
          const target = words.find(w => w.id === id);
          if (!target) return;

          setWords(prev => prev.map(w => w.id === id ? { ...w, status: WordStatus.PROCESSING } : w));

          try {
            const phonetic = await getPhonetic(target.text);
            const sentence = await getSentence(target.text);
            const imageUrl = await getImage(target.text);

            setWords(prev => prev.map(w => w.id === id ? {
              ...w,
              status: WordStatus.COMPLETED,
              phonetic,
              sentence,
              imageUrl,
            } : w));

            addToast(`Regenerated data for "${target.text}"`, 'success');
          } catch (e) {
            setWords(prev => prev.map(w => w.id === id ? { ...w, status: WordStatus.FAILED, error: e.message } : w));
          }
        };

        const handleGenerateAll = async (ids) => {
          setIsGenerating(true);
          for (const id of ids) {
            await handleRegenerateWord(id);
          }
          setIsGenerating(false);
          addToast('All words updated successfully!', 'success');
        };

        const handleSpeakWord = (wordText) => {
          if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(wordText);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
          }
        };

        const handleSpellOutWord = async (wordText) => {
          if (!window.speechSynthesis) return;
          window.speechSynthesis.cancel();
          
          handleSpeakWord(wordText);
          await new Promise(r => setTimeout(r, 1000));

          for (const char of wordText.split('')) {
            if (/[a-z0-9]/i.test(char)) {
              const charUtterance = new SpeechSynthesisUtterance(char);
              charUtterance.lang = 'en-US';
              window.speechSynthesis.speak(charUtterance);
              await new Promise(r => setTimeout(r, 600));
            }
          }

          await new Promise(r => setTimeout(r, 600));
          handleSpeakWord(wordText);
        };

        return (
          <div className="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex flex-col font-sans">
            <Toast toasts={toasts} setToasts={setToasts} />

            {/* Introductory Fullscreen Video Overlay */}
            {showIntroVideo && (
              <div 
                className="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center overflow-hidden cursor-pointer"
                onClick={showUnmutePrompt ? handleUnmuteVideo : undefined}
              >
                <video
                  ref={videoRef}
                  src={INTRO_VIDEO_URL}
                  autoPlay
                  playsInline
                  preload="auto"
                  muted={videoMuted}
                  onEnded={() => setShowIntroVideo(false)}
                  onError={() => setShowIntroVideo(false)}
                  className="w-full h-full object-cover"
                />
                
                {/* Botón flotante para activar sonido si el navegador lo silenció por autoplay */}
                {showUnmutePrompt && (
                  <div className="absolute top-6 left-1/2 -translate-x-1/2 z-[110]">
                    <button
                      onClick={handleUnmuteVideo}
                      className="px-4 py-2 bg-indigo-600/90 hover:bg-indigo-600 text-white text-xs sm:text-sm font-bold rounded-full border border-white/40 shadow-xl backdrop-blur-md transition transform hover:scale-105 flex items-center space-x-2 animate-bounce"
                    >
                      <span>🔊 Toca para activar el sonido</span>
                    </button>
                  </div>
                )}

                {/* Botón pequeño en la parte inferior para saltar el video y ver la ruleta */}
                <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-[110]">
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      handleSkipVideo();
                    }}
                    className="px-5 py-2 bg-black/60 hover:bg-black/85 text-white/90 hover:text-white text-xs sm:text-sm font-semibold rounded-full border border-white/30 shadow-lg backdrop-blur-sm transition transform hover:scale-105 flex items-center space-x-1.5"
                  >
                    <span>Saltar</span>
                    <span>➔</span>
                  </button>
                </div>
              </div>
            )}

            {/* Navigation Header */}
            <header className="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 sticky top-0 z-30 shadow-sm">
              <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center space-x-3">
                  <img src={APP_LOGO_URL} alt="Logo" className="h-24 sm:h-32 w-auto object-contain" />
                  <div>
                    <h1 className="font-bubble text-2xl font-black text-indigo-600 dark:text-indigo-400 leading-tight">
                      Spelling Bee Helper
                    </h1>
                    <p className="text-xs text-gray-500 dark:text-gray-400 font-semibold">Interactive Wheel & Practice</p>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <button
                    onClick={() => setViewMode(viewMode === 'wheel' ? 'main' : 'wheel')}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition text-xs sm:text-sm flex items-center space-x-1.5"
                  >
                    <span>{viewMode === 'wheel' ? '📋 Manage Words' : '🎡 Play Spinning Wheel'}</span>
                  </button>

                  <button
                    onClick={() => setShowQuiz(true)}
                    className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-gray-950 font-black rounded-xl shadow transition text-xs sm:text-sm flex items-center space-x-1.5 border border-amber-300"
                  >
                    <span>🎧 Unit 2 Quiz</span>
                  </button>

                  <button
                    onClick={() => setShowDiploma(true)}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition text-xs sm:text-sm flex items-center space-x-1.5"
                  >
                    <span>🎓 Diploma</span>
                  </button>
                </div>
              </div>
            </header>

            {/* Add words / Input Bar on Main View */}
            {viewMode === 'main' && (
              <div className="bg-indigo-50 dark:bg-indigo-950/40 p-4 border-b border-indigo-100 dark:border-indigo-900">
                <div className="max-w-7xl mx-auto space-y-3">
                  <form onSubmit={handleAddWords} className="flex flex-wrap gap-2">
                    <input
                      type="text"
                      value={newWordsInput}
                      onChange={(e) => setNewWordsInput(e.target.value)}
                      placeholder="Add words separated by commas or lines (e.g. apple, banana, chair)"
                      className="flex-1 min-w-[280px] px-4 py-2 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-white text-sm"
                    />
                    <button
                      type="submit"
                      className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow text-sm transition"
                    >
                      + Add Words
                    </button>
                  </form>

                  <div className="flex flex-wrap items-center gap-3 text-xs text-gray-600 dark:text-gray-300">
                    <label className="cursor-pointer bg-white dark:bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-700 font-semibold hover:bg-gray-50 transition">
                      📁 Import File (DOCX, XLSX, PDF, ZIP)
                      <input type="file" accept=".docx,.xlsx,.xls,.pdf,.zip" onChange={handleFileLoad} className="hidden" />
                    </label>
                  </div>
                </div>
              </div>
            )}

            {/* Main Content Area */}
            {viewMode === 'main' ? (
              <MainContent
                words={words}
                onAddWords={handleAddWords}
                onFileLoad={handleFileLoad}
                onGenerate={handleGenerateAll}
                onDeleteWord={handleDeleteWord}
                onRegenerateWord={handleRegenerateWord}
                onOpenSpellingBee={(w) => setSpellingBeeWord(w)}
                onImageClick={(w) => handleSpeakWord(w.text)}
                onSpeak={handleSpeakWord}
                isGenerating={isGenerating}
              />
            ) : (
              <SpinningWheel
                words={words}
                onClose={() => setViewMode('main')}
                background={background}
                logo={logo}
                onOpenSpellingBee={(w) => setSpellingBeeWord(w)}
                onSpeak={handleSpeakWord}
                isWhiteBg={isWhiteBg}
                setIsWhiteBg={setIsWhiteBg}
                isMuted={isMuted}
                setIsMuted={setIsMuted}
                hideLetters={hideLetters}
                setHideLetters={setHideLetters}
                onStartQuiz={() => setShowQuiz(true)}
              />
            )}

            {/* Spelling Bee Modal */}
            {spellingBeeWord && (
              <SpellingBee
                word={spellingBeeWord}
                onClose={() => setSpellingBeeWord(null)}
                onPronounce={handleSpeakWord}
                onSpellOut={handleSpellOutWord}
              />
            )}

            {/* Unit 2 Quiz Modal */}
            {showQuiz && (
              <Unit2Quiz
                words={words.filter(w => w.status === WordStatus.COMPLETED)}
                onClose={() => setShowQuiz(false)}
                onComplete={() => {
                  setShowQuiz(false);
                  setShowDiploma(true);
                }}
              />
            )}

            {/* Diploma / Certificate Modal */}
            {showDiploma && (
              <DiplomaModal
                courseName={courseName}
                onClose={() => setShowDiploma(false)}
              />
            )}
          </div>
        );
      };

      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
